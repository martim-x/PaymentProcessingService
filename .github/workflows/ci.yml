name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ruff:
    name: Линтер и форматирование (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - run: pip install ruff==0.17.5 black==26.5.1
      - run: ruff check src tests
      - run: black --check src tests migrations scripts

  mypy:
    name: Типы (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - name: Установка зависимостей
        run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - run: pip install mypy==2.4.1
      - run: mypy src/payment

  bandit:
    name: Безопасность (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - run: pip install "bandit[toml]==1.9.4"
      - name: Сканирование src
        # -r обязателен: без него bandit пишет "Skipping directory (src)" и выходит с кодом 0
        run: bandit -c pyproject.toml -r -q src

  unit:
    name: Unit-тесты (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.15.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - run: pytest tests/unit -q

  integration:
    name: Integration-тесты (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19.0-alpine
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Миграции
        env:
          PAYMENT_DATABASE_URL: postgresql+psycopg://payment:payment@localhost:5432/payments
        run: alembic upgrade head
      - name: Тесты
        env:
          # Тесты работают в собственной временной схеме и не используют
          # PAYMENT_DATABASE_URL как fallback — тестовый DSN задаётся явно
          PAYMENT_TEST_DATABASE_URL: postgresql+psycopg://payment:payment@localhost:5432/payments
        run: pytest tests/integration -q

  e2e:
    name: E2E (docker compose)
    runs-on: ubuntu-latest
    # Флаг нужен не только первому `up`: каждый `docker compose up/start` в job'е
    # пересоздаёт consumer и подставляет значение заново из окружения. Без него
    # SSRF-гард отвергает host.docker.internal, и webhook-сценарии получают
    # «private address 172.17.0.1» вместо HTTP-запроса.
    env:
      PAYMENT_WEBHOOK_ALLOW_PRIVATE_HOSTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - name: Установка зависимостей
        run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Поднять стек
        run: docker compose up --build -d
      - name: Дождаться готовности API
        run: |
          for i in $(seq 1 60); do
            if curl -sf -H "X-API-Key: ${PAYMENT_API_KEY:-local-dev-key}" http://localhost:8000/health > /dev/null; then echo "API ready"; exit 0; fi
            sleep 2
          done
          echo "API did not become ready"; docker compose logs --tail 100; exit 1
      - name: Полный сценарий (API → outbox → consumer → webhook)
        run: pytest tests/e2e -q
        env:
          PAYMENT_API_URL: http://localhost:8000
          PAYMENT_API_KEY: local-dev-key
      - name: "Chaos: SIGKILL consumer'а во время обработки"
        run: ./scripts/chaos_kill9.sh
        env:
          PAYMENT_API_KEY: local-dev-key
      # Без флага тест пропускается, поэтому DLQ-путь раньше не проверялся в CI.
      # Management API RabbitMQ опубликован compose'ом на 15673 (guest:guest).
      - name: "DLQ E2E: три неудачных webhook → payments.dlq"
        run: pytest tests/e2e/test_failed_webhook_dlq.py -q
        env:
          PAYMENT_RUN_DLQ_E2E: "1"
          PAYMENT_API_URL: http://localhost:8000
          PAYMENT_API_KEY: local-dev-key
          PAYMENT_RABBITMQ_MANAGEMENT_URL: http://localhost:15673
          PAYMENT_RABBITMQ_MANAGEMENT_API_KEY: "guest:guest"
          PAYMENT_E2E_WEBHOOK_PORT: "9000"
      - name: Логи при падении
        if: failure()
        run: docker compose logs --tail 50
