repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-q"]
        additional_dependencies: ["bandit[toml]"]
        files: ^src/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: venv/bin/mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
        args: ["src/payment"]

      - id: pytest-unit
        name: unit tests
        entry: venv/bin/python -m pytest tests/unit -q
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$
