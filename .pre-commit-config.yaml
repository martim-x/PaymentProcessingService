repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-q"]
        additional_dependencies: ["bandit[toml]"]
        files: ^src/

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: venv/bin/ruff check --fix
        language: system
        types: [python]

      - id: black
        name: black
        entry: black
        language: python
        language_version: python3.15
        additional_dependencies: ["black==26.5.1"]
        types: [python]

      - id: mypy
        name: mypy
        entry: venv/bin/mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
        args: ["src/payment"]

      - id: pytest-unit
        name: unit tests
        entry: venv/bin/python -m pytest tests/unit -q
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$
