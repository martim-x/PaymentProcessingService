name: payment-service

services:
  postgres:
    image: postgres:19.0-alpine

    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payments
    ports:
      - "5433:5432"
    volumes:
      - pgdata19:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payment -d payments" ]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4.1-management-alpine

    volumes:
      - rabbitmqdata44:/var/lib/rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672" # UI: http://localhost:15673
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    build: .

    environment: &service_env
      PAYMENT_DATABASE_URL: ${PAYMENT_DATABASE_URL:-postgresql+psycopg://payment:payment@postgres:5432/payments}
      PAYMENT_RABBITMQ_URL: ${PAYMENT_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-local-dev-key}
      PAYMENT_RABBITMQ_QUEUE: ${PAYMENT_RABBITMQ_QUEUE:-payments.new}
      PAYMENT_RABBITMQ_DLQ: ${PAYMENT_RABBITMQ_DLQ:-payments.dlq}
      PAYMENT_RELAY_INTERVAL: ${PAYMENT_RELAY_INTERVAL:-1.0}
      PAYMENT_RELAY_BATCH: ${PAYMENT_RELAY_BATCH:-100}
      PAYMENT_PROCESS_MIN_SECONDS: ${PAYMENT_PROCESS_MIN_SECONDS:-2.0}
      PAYMENT_PROCESS_MAX_SECONDS: ${PAYMENT_PROCESS_MAX_SECONDS:-5.0}
      PAYMENT_SUCCESS_RATE: ${PAYMENT_SUCCESS_RATE:-0.9}
      PAYMENT_WEBHOOK_TIMEOUT: ${PAYMENT_WEBHOOK_TIMEOUT:-5.0}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-webhook-secret}
      # Разрешать private targets только явным override для локального E2E.
      PAYMENT_WEBHOOK_ALLOW_PRIVATE_HOSTS: ${PAYMENT_WEBHOOK_ALLOW_PRIVATE_HOSTS:-false}
      PAYMENT_MAX_ATTEMPTS: ${PAYMENT_MAX_ATTEMPTS:-3}
      PAYMENT_RETRY_BASE_DELAY: ${PAYMENT_RETRY_BASE_DELAY:-1.0}
      PAYMENT_RETRY_FACTOR: ${PAYMENT_RETRY_FACTOR:-2.0}
      PAYMENT_INFRA_RETRY_BASE_DELAY: ${PAYMENT_INFRA_RETRY_BASE_DELAY:-2.0}
      PAYMENT_CLAIM_TTL_SECONDS: ${PAYMENT_CLAIM_TTL_SECONDS:-30.0}
      PAYMENT_WEBHOOK_CLAIM_TTL_SECONDS: ${PAYMENT_WEBHOOK_CLAIM_TTL_SECONDS:-30.0}
      PAYMENT_CLAIM_WAIT_SECONDS: ${PAYMENT_CLAIM_WAIT_SECONDS:-15.0}
      PAYMENT_CLAIM_POLL_SECONDS: ${PAYMENT_CLAIM_POLL_SECONDS:-0.5}
      PAYMENT_CLAIM_FINALIZE_MARGIN_SECONDS: ${PAYMENT_CLAIM_FINALIZE_MARGIN_SECONDS:-5.0}
      PAYMENT_OUTBOX_MAX_ATTEMPTS: ${PAYMENT_OUTBOX_MAX_ATTEMPTS:-10}
      PAYMENT_CONSUMER_PREFETCH: ${PAYMENT_CONSUMER_PREFETCH:-10}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .

    environment:
      <<: *service_env
    command: uvicorn payment.entrypoints.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  relay:
    build: .

    environment:
      <<: *service_env
    command: python -m payment.entrypoints.relay.runner
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  consumer:
    build: .

    environment:
      <<: *service_env
    command: python -m payment.entrypoints.consumer.app
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pgdata19:
  rabbitmqdata44:
