[project]
name = "payment-service"
version = "0.1.0"
description = "Асинхронный микросервис процессинга платежей (тестовое задание)"
requires-python = ">=3.15.2"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "faststream[rabbit]==0.7.8",
    "httpx==0.28.1",
    "greenlet==3.5.6",
    "psycopg[binary]==3.3.9",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S311", "S105", "S106", "BLE001"]
"src/payment/adapters/gateway/fake_gateway.py" = ["S311"]  # random — эмуляция шлюза
"src/payment/adapters/persistence/unit_of_work.py" = ["S101"]  # assert — внутренние инварианты

[tool.bandit]
exclude_dirs = ["tests", "venv", "migrations"]
# B101: assert — внутренние инварианты UoW; B311: random — эмуляция шлюза (не криптография)
skips = ["B101", "B311"]

[tool.mypy]
python_version = "3.15"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
exclude = ["venv", "tests"]
