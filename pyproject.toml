[project]
name = "payment-service"
version = "0.1.0"
description = "Асинхронный микросервис процессинга платежей (тестовое задание)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "faststream[rabbit]>=0.6",
    "httpx>=0.27",
    "greenlet>=3.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.bandit]
exclude_dirs = ["tests", "venv", "migrations"]
# B101: assert — внутренние инварианты UoW; B311: random — эмуляция шлюза (не криптография)
skips = ["B101", "B311"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
exclude = ["venv", "tests"]

[[tool.mypy.overrides]]
module = ["migrations.*", "payment.entrypoints.*"]
disable_error_code = ["arg-type", "assignment", "union-attr", "call-arg", "attr-defined"]
